name: "BT5-QueenOdds-LoRA-1k-Test"
gpu: 0
dataset:
  num_chunks: 500_000_000
  allow_less_chunks: true
  train_ratio: 0.95
  sort_type: name
  input_train:
    - "/workspace/data/QueenOddsV2/input_train/"
  input_test:
    - "/workspace/data/QueenOddsV2/input_test/"
  input_validation:
    - "/workspace/data/QueenOddsV2/input_validation/"
  train_workers: 8
  test_workers: 4
  fast_chunk_loading: true
training:
  precision: half
  pb_source: "/workspace/nets/BT5-1024x15x32h-rpe-swa-3700000.pb.gz"
  swa: false
  swa_output: false
  swa_max_n: 10
  swa_steps: 100
  max_grad_norm: 10.0
  batch_size: 256
  num_batch_splits: 1
  value_focus_min: 1.0
  value_focus_slope: 0.0
  lookahead_optimizer: false
  renorm: true
  renorm_max_r: 1.0
  renorm_max_d: 0.0
  test_steps: 100
  disable_pb_checkpointing: false
  checkpoint_activations: false
  validation_steps: 10_000
  num_test_positions: 10_240
  train_avg_report_steps: 100
  total_steps: 1000
  checkpoint_steps: 250
  shuffle_size: 10_000 # Smaller for quick testing
  warmup_steps: 100
  mask_legal_moves: true
  lr_values:
    - 0.0002
  lr_boundaries: []
  loss_weights:
    policy: 1.0
    policy_optimistic_st: 0.0
    policy_soft: 8.0
    policy_opponent: 0.00
    policy_next: 0.00
    value_winner: 1.0
    value_q: 1.0
    value_q_cat: 0.1
    value_st: 1.0
    value_q_err: 1.0
    value_st_err: 1.0
    value_st_cat: 0.1
    moves_left: 1.0
    reg: 1.0
  path: "networks/test_1k"
  optimizer: nadam
  beta_1: 0.9
  beta_2: 0.98
  epsilon: 0.00000001
  sparse: false
  return_attn_wts: false
  return_activations: false
model:
  embedding_size: 1024
  policy_embedding_size: 1024
  value_embedding_size: 128
  moves_left_embedding_size: 32
  encoder_layers: 15
  encoder_heads: 32
  encoder_d_model: 1024
  encoder_dff: 4096
  policy_d_model: 1024
  policy_d_aux: 256
  dropout_rate: 0.0
  embedding_style: "new"
  embedding_dense_sz: 512
  value: "wdl"
  moves_left: "v1"
  input_type: "classic"
  use_smolgen: false
  smolgen_hidden_channels: 16
  smolgen_hidden_sz: 64
  smolgen_gen_sz: 64
  smolgen_activation: "swish"
  use_rpe_q: true
  use_rpe_k: true
  use_rpe_v: true
  use_logit_gating: false
  omit_qkv_biases: false
  encoder_rms_norm: false
  policy_optimistic_st: true
  policy_opponent: false
  policy_next: false
  value_st: true
  value_q: true
  soft_policy: true
  categorical_value_buckets: 32
  soft_policy_temperature: 4.0
  quantize_activations: false
  quantize_weights: false
  quantize_activation_bits: 8
  quantize_weight_bits: 8
  quantize_channels: false
  rep_quant: false
  lora_rank: 32
  lora_alpha: 32
