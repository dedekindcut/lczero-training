name: "BT5-QueenOdds-LoRA"
gpu: 0
dataset:
    num_chunks: 500_000_000
    allow_less_chunks: true
    train_ratio: 0.95
    sort_type: name
    input_train:
        - "/workspace/data/QueenOddsV2/input_train/"
    input_test:
        - "/workspace/data/QueenOddsV2/input_test/"
    input_validation:
        - "/workspace/data/QueenOddsV2/input_validation/"
    train_workers: 8
    test_workers: 4
    fast_chunk_loading: true
    # pc_min: 0
    # pc_max: 6
training:
    precision: half
    pb_source: "/workspace/nets/BT5-1024x15x32h-rpe-swa-3700000.pb.gz"
    swa: false
    swa_output: false
    swa_max_n: 10
    swa_steps: 100
    max_grad_norm: 10.0
    batch_size: 128 # Reduced from 512 for OOM
    num_batch_splits: 1
    value_focus_min: 1.0
    value_focus_slope: 0.0
    lookahead_optimizer: false
    renorm: true
    renorm_max_r: 1.0
    renorm_max_d: 0.0
    test_steps: 5_000
    disable_pb_checkpointing: false
    checkpoint_activations: false

    # validation_steps: 5000
    validation_steps: 5000
    num_test_positions: 10_240
    train_avg_report_steps: 1_000
    total_steps: 200_000
    checkpoint_steps: 100_000
    shuffle_size: 500_000 # Restored shuffle size
    warmup_steps: 1000
    mask_legal_moves: true
    lr_values:
        - 0.0002 # Increased slightly for BS 512
        - 0.000316
        - 0.0001
    lr_boundaries:
        - 2_400_000
        - 2_700_000
    loss_weights:
        policy: 1.0
        policy_optimistic_st: 0.0
        policy_soft: 8.0 # loss is much smaller at optimum
        policy_opponent: 0.00
        policy_next: 0.00
        value_winner: 1.0
        value_q: 1.0
        value_q_cat: 0.1
        value_st: 1.0 # larger because mse loss
        value_q_err: 1.0 # both error weights should be the same
        value_st_err: 1.0
        value_st_cat: 0.1
        moves_left: 1.0
        reg: 1.0
    path: "networks"

    optimizer: nadam # sgd/nadam/rmsprop/adabelief/adam
    beta_1: 0.9
    beta_2: 0.98
    epsilon: 0.00000001 # 1e-7
    sparse: false

    return_attn_wts: false
    return_activations: false

model:
    # Dimension parameters - Matches BT5-1024x15x32h
    embedding_size: 1024
    policy_embedding_size: 1024
    value_embedding_size: 128
    moves_left_embedding_size: 32
    encoder_layers: 15 # 15 blocks
    encoder_heads: 32 # 32 heads
    encoder_d_model: 1024 # Embedding size
    encoder_dff: 4096 # Usually 4x d_model for standard Transformers
    policy_d_model: 1024
    policy_d_aux: 256
    dropout_rate: 0.0

    embedding_style: "new"
    embedding_dense_sz: 512 # Set to 512 as per inspect_pb_gz.py output

    value: "wdl"
    moves_left: "v1"
    input_type: "classic"

    # Smolgen
    use_smolgen: false
    smolgen_hidden_channels: 16
    smolgen_hidden_sz: 64
    smolgen_gen_sz: 64
    smolgen_activation: "swish"

    # RPE
    use_rpe_q: true
    use_rpe_k: true
    use_rpe_v: true

    # Gating
    use_logit_gating: false

    # Ablations
    omit_qkv_biases: false # MATCHED BT5.YAML
    encoder_rms_norm: false # MATCHED BT5.YAML

    # Output heads
    policy_optimistic_st: true # MATCHED BT5.YAML
    policy_opponent: false
    policy_next: false
    value_st: true
    value_q: true
    soft_policy: true
    categorical_value_buckets: 32
    soft_policy_temperature: 4.0

    # quantization
    quantize_activations: false
    quantize_weights: false
    quantize_activation_bits: 8
    quantize_weight_bits: 8
    quantize_channels: false
    rep_quant: false

    # LoRA
    lora_rank: 32
    lora_alpha: 32 # Scaling factor = lora_alpha / lora_rank = 1.0. Increase to 64 for 2.0x scaling.
